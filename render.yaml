# ============================================================================
# render.yaml — Honest Dice Bot (Render Blueprint)
# Deploy: New Blueprint -> conectar este repo -> preencher DISCORD_BOT_TOKEN
#
# POR QUE "web service" e não "worker":
#   O plano gratuito do Render não oferece mais Background Workers
#   (erro: "service type is not available for this plan").
#   Web Services são gratuitos. Para o bot nunca dormir, o main.py expõe
#   um endpoint /health e o UptimeRobot (gratuito) faz ping a cada 5 min.
# ============================================================================
services:
  - type: web
    name: honest-dice-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false # vazio no blueprint; você preenche no painel do Render
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: /app/data/honest_dice.log
      - key: PORT
        value: 3000
